name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches project links that have gone dead

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: r3dg0d/r3dg0d
          path: profile
      - name: Structure, metadata, accessibility and stale references
        run: python3 scripts/check_site.py --readme profile/README.md
      - name: Generated project blocks are up to date
        run: python3 scripts/sync_projects.py --check --readme profile/README.md
      - name: External links
        run: python3 scripts/check_site.py --links
